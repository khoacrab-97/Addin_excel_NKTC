# SonarCloud (automatic analysis).
# vba/build/*-ascii: mã ASCII sinh tự động từ vba/src, vba/loader (vba/tools/vba_ascii.py; CI kiểm tra luôn khớp) —
# không phải mã viết tay, loại khỏi phân tích và đo trùng lặp. vba/release: bản dựng nhị phân (.xlam) và version.txt.
sonar.exclusions=vba/build/**,vba/release/**
sonar.cpd.exclusions=vba/build/**
