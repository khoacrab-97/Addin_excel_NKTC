name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Action được cố định theo commit SHA (chú thích ghi phiên bản tương ứng).
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Lỗ hổng đã công bố trong thư viện đi kèm bản phát hành → CI đỏ.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev
      # typecheck → lint → format:check → unit test → build production
      - run: npm run check
      # Bản VBA: kiểm thử công cụ chuyển mã và bảo đảm mã ASCII (vba/build/src-ascii) khớp vba/src.
      - name: VBA sources
        run: |
          python3 -m unittest discover -s vba/tools -p "test_*.py"
          python3 vba/tools/vba_ascii.py vba/src vba/build/src-ascii
          python3 vba/tools/vba_ascii.py vba/loader vba/build/loader-ascii
          git status --porcelain -- vba/build
          test -z "$(git status --porcelain -- vba/build)"
      - name: Validate production manifest (Microsoft validation service)
        run: npx office-addin-manifest validate dist/manifest.xml
      - name: Install NSIS (Windows installer compiler)
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: Build Windows installer (dist/NhatKyThiCong_Setup.exe)
        run: npm run build:installer
      # Bản VBA: khi đã có bản dựng trên Windows trong vba/release → kiểm tra version.txt và dựng bộ cài NhatKyTC_Setup.
      - name: Build VBA installer (when vba/release has a build)
        run: |
          if [ -f vba/release/version.txt ]; then
            scripts/build-vba-release.sh /tmp/vba-pages /tmp/vba-installer
          else
            echo "vba/release chưa có bản dựng — bỏ qua."
          fi
      # Bộ cài để chạy thử trước khi phát hành (Actions → lần chạy CI → Artifacts → vba-installer-test).
      # Chỉ lần chạy push (nhánh của repo) — không tạo bộ cài thử từ Pull Request (có thể từ fork).
      - if: github.event_name == 'push' && hashFiles('vba/release/version.txt') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vba-installer-test
          path: /tmp/vba-installer/*.exe
          if-no-files-found: error
          retention-days: 14
