name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # typecheck → lint → format:check → unit test → build production
      - run: npm run check
      - name: Validate production manifest (Microsoft validation service)
        run: npx office-addin-manifest validate dist/manifest.xml
